# Netlify: static storefront + two Netlify Functions — `api` (the Express API)
# and `scheduled-jobs` (hourly month-end qualification and reservation expiry).
# Both are always built as production (NODE_ENV=production), so demo sign-in
# and demo data are impossible here, and with the deploy context baked in:
# deploy previews and branch deploys are "staging" and refuse to serve from a
# database marked "production" (docs/OPERATIONS.md → Environment isolation).
# Required environment variables (Netlify → Site configuration → Environment),
# with a DIFFERENT value per deploy context where marked (*):
#   DATABASE_URL (*)       Postgres connection string — production database for the
#                          Production context, staging database for previews/branches
#   SITE_URL (*)           https://<your-domain>
#   ADMIN_EMAILS           administrators (Clerk-verified emails)
#   CLERK_SECRET_KEY (*)   sk_live_… (production) / sk_test_… (previews)  ┐ without valid keys
#   CLERK_PUBLISHABLE_KEY (*)  pk_… matching the secret key                │ every /api request
#   VITE_CLERK_PUBLISHABLE_KEY (*)  same pk_… (build)                      ┘ returns 503
#   SHOPIFY_STORE_DOMAIN, SHOPIFY_STOREFRONT_TOKEN, SHOPIFY_WEBHOOK_SECRET  (Shopify checkout)
#   RESEND_API_KEY, NOTIFY_FROM_EMAIL                                      (email)
# Must NOT be set: DEMO_AUTH, SEED_DEMO_DATA (either one makes every /api request return 503).
# Check a context's settings with `pnpm --filter @workspace/api-server run preflight`.

# The build never touches the database. Schema changes are applied separately,
# before deploying code that needs them, with the reviewed migrations in
# lib/db/migrations (see docs/DATABASE_MIGRATIONS.md). drizzle-kit refuses to
# run inside a Netlify build (lib/db/drizzle.config.ts).
# Give each deploy context its own database: set DATABASE_URL with a different
# value per context (Production vs Deploy previews / Branch deploys), so a
# preview can never reach the production database.

[build]
  # Builds the storefront and the API function. No schema push.
  command = "pnpm --filter @workspace/masmila-fragrances run build && pnpm --filter @workspace/api-server run build:netlify"
  publish = "artifacts/masmila-fragrances/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.15.0"
  # Required by vite.config.ts
  PORT = "5173"
  BASE_PATH = "/"

[functions]
  directory = "netlify/functions"
  # Already bundled by esbuild in the build command.
  node_bundler = "none"

# Month-end qualification and unpaid EFT reservation expiry (src/netlify-jobs.ts).
# Scheduled functions run only on the published production deploy.
[functions."scheduled-jobs"]
  schedule = "@hourly"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Client-demo deployment: keep it out of search engines (it shows placeholder
# brand photography). Remove before the public launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

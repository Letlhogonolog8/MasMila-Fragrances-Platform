openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Mas'Mila storefront, reseller portal, team/commission engine and admin API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
    description: Public fragrance catalogue and storefront
  - name: checkout
    description: Cart checkout and order tracking
  - name: account
    description: Signed-in customer account
  - name: reseller
    description: Reseller applications and portal
  - name: admin
    description: Administrator console
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------------------------------------------------------- catalog
  /store-config:
    get:
      operationId: getStoreConfig
      tags: [catalog]
      summary: Public storefront configuration (shipping, minimums, contact)
      responses:
        "200":
          description: Store config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreConfig" }
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List and search fragrances. Reseller prices are only included for approved resellers.
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: family, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: string } }
        - name: collection
          in: query
          required: false
          schema: { type: string, enum: [best-sellers, new-arrivals, featured] }
        - { name: search, in: query, required: false, schema: { type: string } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [featured, name, price-asc, price-desc, newest] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 48 }
      responses:
        "200":
          description: Fragrance products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
  /home-summary:
    get:
      operationId: getHomeSummary
      tags: [catalog]
      responses:
        "200":
          description: Storefront home content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeSummary" }
  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewsletterInput" }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /enquiries:
    post:
      operationId: submitEnquiry
      tags: [catalog]
      summary: Corporate / bulk enquiry or contact form
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryInput" }
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /referrals:
    get:
      operationId: getReferral
      tags: [catalog]
      summary: Resolve a reseller referral code (and record the visit)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Referral info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralInfo" }

  # ---------------------------------------------------------------- checkout
  /checkout:
    post:
      operationId: checkout
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
  /orders/track:
    get:
      operationId: trackOrder
      tags: [checkout]
      parameters:
        - { name: orderNumber, in: query, required: true, schema: { type: string } }
        - { name: email, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  # ---------------------------------------------------------------- account
  /me:
    get:
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
    patch:
      operationId: updateMe
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [account]
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /me/wishlist:
    get:
      operationId: listWishlist
      tags: [account]
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /me/wishlist/{productId}:
    put:
      operationId: addToWishlist
      tags: [account]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
    delete:
      operationId: removeFromWishlist
      tags: [account]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /me/notifications:
    get:
      operationId: listNotifications
      tags: [account]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [account]
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  # ---------------------------------------------------------------- reseller
  /reseller-applications:
    post:
      operationId: submitResellerApplication
      tags: [reseller]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerApplicationInput" }
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResellerApplication" }
  /reseller/dashboard:
    get:
      operationId: getResellerDashboard
      tags: [reseller]
      responses:
        "200":
          description: Reseller / Team Leader / Manager dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResellerDashboard" }
  /reseller/team:
    get:
      operationId: listResellerTeam
      tags: [reseller]
      responses:
        "200":
          description: Direct team members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamMember" }
  /reseller/organisation:
    get:
      operationId: getResellerOrganisation
      tags: [reseller]
      responses:
        "200":
          description: Wider organisation (Managers)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organisation" }
  /reseller/incentives:
    get:
      operationId: listResellerIncentives
      tags: [reseller]
      responses:
        "200":
          description: Incentive ledger entries for the signed-in reseller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
  /reseller/sales:
    get:
      operationId: listResellerSales
      tags: [reseller]
      summary: Customer sales attributed to the signed-in reseller
      responses:
        "200":
          description: Attributed sales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /marketing-materials:
    get:
      operationId: listMarketingMaterials
      tags: [reseller]
      responses:
        "200":
          description: Marketing materials available to the signed-in reseller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketingMaterial" }

  # ---------------------------------------------------------------- admin
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
  /admin/site-content:
    put:
      operationId: updateSiteContent
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteContent" }
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteContent" }
  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Reseller application queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApplication" }
  /admin/applications/{id}/decision:
    post:
      operationId: decideApplication
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDecisionInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApplication" }
  /admin/resellers:
    get:
      operationId: listAdminResellers
      tags: [admin]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Resellers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminReseller" }
  /admin/resellers/{id}:
    patch:
      operationId: updateAdminReseller
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResellerUpdate" }
      responses:
        "200":
          description: Updated reseller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReseller" }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Customers and users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCustomer" }
  /admin/customers/{id}:
    patch:
      operationId: updateAdminCustomer
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCustomerUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomer" }
  /admin/teams:
    get:
      operationId: listAdminTeams
      tags: [admin]
      responses:
        "200":
          description: Full reseller hierarchy with current-month volume
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamNode" }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      responses:
        "200":
          description: Products incl. cost, reseller price and inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProduct" }
    post:
      operationId: createAdminProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/{id}:
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: channel, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /admin/orders/{id}/refund:
    post:
      operationId: refundAdminOrder
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundInput" }
      responses:
        "200":
          description: Refunded / cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /admin/commissions:
    get:
      operationId: listAdminCommissions
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: period, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Commission ledger
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
  /admin/commissions/approve:
    post:
      operationId: approveCommissions
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdsInput" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResult" }
  /admin/payouts:
    get:
      operationId: listAdminPayouts
      tags: [admin]
      responses:
        "200":
          description: Payout records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payout" }
    post:
      operationId: createPayouts
      tags: [admin]
      summary: Pay out all approved incentives (optionally for selected resellers)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInput" }
      responses:
        "200":
          description: Payouts created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payout" }
  /admin/qualification:
    get:
      operationId: getQualification
      tags: [admin]
      parameters:
        - { name: period, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Qualification snapshot for a period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationResult" }
    post:
      operationId: runQualification
      tags: [admin]
      summary: Run (or re-run) monthly qualification, rank changes and incentive settlement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationRunInput" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualificationResult" }
  /admin/fraud-flags:
    get:
      operationId: listFraudFlags
      tags: [admin]
      responses:
        "200":
          description: Fraud / abuse flags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FraudFlag" }
  /admin/fraud-flags/{id}:
    patch:
      operationId: updateFraudFlag
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
      responses:
        "200":
          description: Updated flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FraudFlag" }
  /admin/enquiries:
    get:
      operationId: listAdminEnquiries
      tags: [admin]
      responses:
        "200":
          description: Corporate and contact enquiries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Enquiry" }
  /admin/enquiries/{id}:
    patch:
      operationId: updateAdminEnquiry
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
  /admin/marketing-materials:
    get:
      operationId: listAdminMarketingMaterials
      tags: [admin]
      responses:
        "200":
          description: All marketing materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketingMaterial" }
    post:
      operationId: createMarketingMaterial
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketingMaterialInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingMaterial" }
  /admin/marketing-materials/{id}:
    delete:
      operationId: deleteMarketingMaterial
      tags: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      parameters:
        - { name: entityType, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Latest audit log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }
  /admin/reports:
    get:
      operationId: getAdminReport
      tags: [admin]
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ReportType" }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Report table (JSON) or CSV download when format=csv
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    CountResult:
      type: object
      required: [count]
      properties:
        count: { type: integer }
    IdsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: integer }
    StatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }
    SiteContent:
      type: object
      additionalProperties: { type: string }

    StoreConfig:
      type: object
      required:
        [currency, shippingFlatRate, freeShippingThreshold, openingOrder, reorderMinimum,
         whatsappNumber, shopifyCheckoutEnabled, bankDetails, authMode, siteUrl]
      properties:
        currency: { type: string }
        shippingFlatRate: { type: number }
        freeShippingThreshold: { type: number }
        openingOrder: { type: integer }
        reorderMinimum: { type: integer }
        whatsappNumber: { type: string }
        shopifyCheckoutEnabled: { type: boolean }
        bankDetails: { type: string }
        authMode: { type: string, enum: [clerk, demo, none] }
        siteUrl: { type: string }

    Product:
      type: object
      required:
        [id, slug, name, sku, family, category, size, price, recommendedRetailPrice,
         resellerPrice, image, imageAlt, notes, badge, isBestSeller, isNew, stockStatus]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        sku: { type: string }
        family: { type: string }
        category: { type: string }
        size: { type: string }
        price: { type: number, description: Retail price in ZAR }
        recommendedRetailPrice: { type: number }
        resellerPrice:
          type: ["number", "null"]
          description: Only populated for approved resellers in good standing
        image: { type: string }
        imageAlt: { type: string }
        notes:
          type: array
          items: { type: string }
        badge: { type: ["string", "null"] }
        isBestSeller: { type: boolean }
        isNew: { type: boolean }
        stockStatus: { type: string, enum: [in_stock, low_stock, out_of_stock] }
    ProductDetail:
      type: object
      required:
        [id, slug, name, sku, family, category, size, price, recommendedRetailPrice,
         resellerPrice, image, imageAlt, notes, badge, isBestSeller, isNew, stockStatus,
         description, scentProfile, topNotes, middleNotes, baseNotes, seoTitle,
         seoDescription, related]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
